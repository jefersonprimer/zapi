services:
  postgres:
    image: postgres:16-alpine
    container_name: primer-chat-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: primer_chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  bg-remover:
    build:
      context: ./services/bg-remover
      dockerfile: Dockerfile
    container_name: zapi-bg-remover
    ports:
      - "5050:5050"
    environment:
      - WORKERS=2
    restart: unless-stopped
    # Uncomment below for GPU acceleration (NVIDIA):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgdata:
